<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Emacs</title>
<link rel="stylesheet" href="xterm.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #101010;
    overflow: hidden;
  }
  #bar {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 30px;
    background: #1c1c1c;
    display: flex;
    align-items: center;
    padding: 0 6px;
    box-sizing: border-box;
    font-family: "HarmonyOS Sans SC", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    z-index: 10;
  }
  #bar .title {
    color: #cfcfcf;
    font-size: 12px;
    margin-right: auto;
    padding-left: 4px;
  }
  #bar button {
    background: #2a2a2a;
    color: #dddddd;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    height: 22px;
    padding: 0 10px;
    margin-left: 6px;
    font-family: inherit;
    cursor: pointer;
  }
  #bar button:active {
    background: #3d3d3d;
  }
  #term {
    position: absolute;
    left: 0;
    right: 0;
    top: 30px;
    bottom: 0;
    padding: 2px 4px 2px 8px;
    box-sizing: border-box;
  }
  .xterm .xterm-viewport {
    background-color: #101010 !important;
  }
  .xterm .xterm-viewport::-webkit-scrollbar {
    width: 8px;
  }
  .xterm .xterm-viewport::-webkit-scrollbar-thumb {
    background: #4a4a4a;
    border-radius: 4px;
  }
</style>
</head>
<body>
<div id="bar">
  <span class="title">Emacs</span>
  <button id="btn-font-down">A-</button>
  <button id="btn-font-up">A+</button>
  <button id="btn-select-all">全选</button>
  <button id="btn-copy">复制</button>
  <button id="btn-bottom">底部</button>
</div>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-web-links.js"></script>
<script>
(function () {
  var theme = {
    background: '#101010',
    foreground: '#e6e6e6',
    cursor: '#e6e6e6',
    cursorAccent: '#101010',
    selectionBackground: '#3a5f8a',
    black: '#2e3436',
    red: '#ef2929',
    green: '#8ae234',
    yellow: '#fce94f',
    blue: '#729fcf',
    magenta: '#ad7fa8',
    cyan: '#34e2e2',
    white: '#eeeeec',
    brightBlack: '#555753',
    brightRed: '#ef2929',
    brightGreen: '#8ae234',
    brightYellow: '#fce94f',
    brightBlue: '#729fcf',
    brightMagenta: '#ad7fa8',
    brightCyan: '#34e2e2',
    brightWhite: '#ffffff'
  };

  var clipCache = '';

  function b64ToUtf8(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) {
      bytes[i] = bin.charCodeAt(i);
    }
    return new TextDecoder('utf-8').decode(bytes);
  }

  function utf8ToB64(text) {
    var bytes = new TextEncoder().encode(text);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) {
      bin += String.fromCharCode(bytes[i]);
    }
    return btoa(bin);
  }

  var term = new Terminal({
    allowProposedApi: true,
    cursorBlink: true,
    cursorStyle: 'block',
    fontFamily: '"Noto Sans Mono", "HarmonyOS Sans SC", monospace',
    fontSize: 15,
    lineHeight: 1.15,
    letterSpacing: 0,
    scrollback: 20000,
    smoothScrollDuration: 80,
    macOptionIsMeta: false,
    rightClickSelectsWord: true,
    theme: theme
  });

  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon.WebLinksAddon(function (event, uri) {
    if (window.ohosBridge && ohosBridge.openUrl) {
      ohosBridge.openUrl(uri);
    }
  }));

  term.open(document.getElementById('term'));

  // OSC 52: Emacs uses this for the system clipboard (kill/yank).
  term.parser.registerOscHandler(52, function (data) {
    var sep = data.indexOf(';');
    if (sep < 0) {
      return false;
    }
    var payload = data.slice(sep + 1);
    if (payload === '?') {
      if (window.ohosBridge && ohosBridge.requestClipboard) {
        ohosBridge.requestClipboard();
      } else {
        window.termClipboardReply('');
      }
      return true;
    }
    try {
      var text = b64ToUtf8(payload);
      clipCache = text;
      if (window.ohosBridge) {
        ohosBridge.copy(text);
      }
    } catch (e) {
      // ignore malformed payloads
    }
    return true;
  });

  window.termClipboardReply = function (text) {
    if (typeof text === 'string' && text.length > 0) {
      clipCache = text;
    }
    var reply = '\u001b]52;c;' + utf8ToB64(clipCache) + '\u001b\\';
    if (window.ohosBridge) {
      ohosBridge.write(reply);
    }
  };

  window.termSetClipboardCache = function (text) {
    if (typeof text === 'string') {
      clipCache = text;
    }
  };

  function safeResize() {
    try {
      fit.fit();
    } catch (e) {
      // ignore
    }
  }

  term.onData(function (data) {
    if (window.ohosBridge) {
      ohosBridge.write(data);
    }
  });

  term.onResize(function (size) {
    if (window.ohosBridge) {
      ohosBridge.resize(size.cols, size.rows);
    }
  });

  // Ctrl+Shift+C / Ctrl+Shift+V like most desktop terminals.
  term.attachCustomKeyEventHandler(function (event) {
    if (event.type !== 'keydown') {
      return true;
    }
    if (event.ctrlKey && !event.shiftKey && event.code === 'KeyY') {
      if (navigator.clipboard && navigator.clipboard.readText) {
        if (window.ohosBridge && ohosBridge.log) {
          ohosBridge.log('clip-api-available');
        }
        navigator.clipboard.readText().then(function (text) {
          if (window.ohosBridge && ohosBridge.log) {
            ohosBridge.log('clip-api-len=' + text.length);
          }
          if (text) {
            clipCache = text;
          }
        }).catch(function (e) {
          if (window.ohosBridge && ohosBridge.log) {
            ohosBridge.log('clip-api-err=' + String(e));
          }
        });
      } else if (window.ohosBridge && ohosBridge.log) {
        ohosBridge.log('clip-api-missing');
      }
      return true;
    }
    if (event.ctrlKey && event.shiftKey && event.code === 'KeyC') {
      var sel = term.getSelection();
      if (sel && window.ohosBridge) {
        ohosBridge.copy(sel);
      }
      return false;
    }
    return true;
  });

  window.termWrite = function (data) {
    term.write(data);
  };
  window.termReset = function () {
    term.reset();
  };
  window.termSetFont = function (size) {
    term.options.fontSize = size;
    safeResize();
  };
  window.termSelectAll = function () {
    term.selectAll();
  };
  window.termGetSelection = function () {
    return term.getSelection();
  };
  window.termClearSelection = function () {
    term.clearSelection();
  };
  window.termPaste = function (text) {
    term.paste(text);
  };
  window.termFit = function () {
    safeResize();
  };
  window.termScrollBottom = function () {
    term.scrollToBottom();
  };
  window.termFocus = function () {
    term.focus();
  };
  window.termHasSelection = function () {
    return term.hasSelection();
  };

  window.addEventListener('resize', function () {
    safeResize();
  });

  if (window.ResizeObserver) {
    var ro = new ResizeObserver(function () {
      safeResize();
    });
    ro.observe(document.getElementById('term'));
  }

  var fontSize = 15;
  try {
    var saved = parseInt(localStorage.getItem('emacs.fontSize') || '0', 10);
    if (saved >= 9 && saved <= 32) {
      fontSize = saved;
      term.options.fontSize = fontSize;
    }
  } catch (e) {
    // ignore
  }
  function setFont(delta) {
    fontSize = Math.max(9, Math.min(32, fontSize + delta));
    term.options.fontSize = fontSize;
    try {
      localStorage.setItem('emacs.fontSize', String(fontSize));
    } catch (e) {
      // ignore
    }
    safeResize();
    term.focus();
  }

  function bind(id, fn) {
    var el = document.getElementById(id);
    if (el) {
      el.addEventListener('click', function (ev) {
        ev.preventDefault();
        fn();
        setTimeout(function () { term.focus(); }, 30);
      });
    }
  }

  bind('btn-font-down', function () { setFont(-1); });
  bind('btn-font-up', function () { setFont(1); });
  bind('btn-select-all', function () { term.selectAll(); });
  bind('btn-copy', function () {
    var sel = term.getSelection();
    if (sel.length > 0) {
      clipCache = sel;
      if (window.ohosBridge) {
        ohosBridge.copy(sel);
      }
    }
  });
  bind('btn-bottom', function () { term.scrollToBottom(); });

  setTimeout(function () {
    safeResize();
    term.focus();
    if (window.ohosBridge) {
      ohosBridge.ready(term.cols, term.rows);
    }
  }, 60);
})();
</script>
</body>
</html>
